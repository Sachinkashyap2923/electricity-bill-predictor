{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card card-custom p-5 col-md-8 mx-auto">
        <div class="display-1 fw-bold text-primary mb-3">404</div>
        <h3 class="fw-bold mb-2">Page Not Found</h3>
        <p class="text-secondary col-md-8 mx-auto mb-4">
            The requested resource or page does not exist on this server.
            Please verify the URL or return to the main application.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom">
                <i class="bi bi-house me-1"></i> Back to Home
            </a>
            <a href="{{ url_for('main.predict') }}" class="btn btn-outline-secondary">
                <i class="bi bi-calculator me-1"></i> Estimate Bill
            </a>
        </div>
    </div>
</div>
{% endblock %}
